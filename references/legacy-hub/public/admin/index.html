<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Content Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182334;font:14px system-ui}aside{position:fixed;inset:0 auto 0 0;width:235px;background:#101f31;color:#9babbd;padding:30px 22px}h2{color:white;font-size:18px;line-height:1.6;margin:0 0 40px}h2 b{background:#55dcc3;color:#102f35;padding:7px;border-radius:10px;margin-right:8px}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:14px;border-radius:8px;margin:4px 0;cursor:pointer}nav button.active{background:#253f51;color:#69e4cc}aside small{position:absolute;bottom:28px;line-height:1.8}main{margin-left:235px;padding:34px 42px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dae0e9;padding-bottom:24px}h1{font-size:27px;margin:8px 0}p{color:#768394;line-height:1.7}button{cursor:pointer;background:#147e70;color:white;border:0;border-radius:7px;padding:11px 15px}input,select{border:1px solid #d6dee7;padding:11px;border-radius:6px;max-width:100%;background:white}section{margin-top:26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.panel{background:white;border:1px solid #e1e6ed;border-radius:12px;padding:23px}.card strong{display:block;font-size:32px;margin-top:14px}.card label{color:#758294;font-size:13px}.panel{margin:22px 0;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #edf0f4;font-size:12px}th{color:#7c8797;font-weight:500}td:nth-child(1){white-space:normal;min-width:220px}span.badge{font-size:10px;border-radius:5px;background:#e9eef5;color:#6b788d;padding:5px 8px}span.HEALTHY{background:#dff6ed;color:#12805e}span.ERROR,span.UNSUPPORTED{background:#ffebe9;color:#bc5149}span.STALE,span.PARTIAL{background:#fff3d7;color:#a0761e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#8290a0}a{color:#148876}pre{white-space:pre-wrap;background:#102337;color:#a9e1d4;padding:20px;border-radius:8px;font-size:12px}.notice{border-left:3px solid #33b29b;padding:12px 18px;background:#e9f5f2;line-height:1.8}.articles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.article{padding:20px;background:white;border:1px solid #e1e6ed;border-radius:10px}.article h3{line-height:1.6}#login{max-width:530px;margin:100px auto;background:white;padding:36px;border-radius:15px}#msg{color:#ad5549}footer{margin-top:35px;color:#8290a0;font-size:12px}@media(max-width:800px){aside{position:static;width:100%;padding:15px}aside h2{margin:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside small{display:none}main{margin:0;padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.articles{grid-template-columns:1fr}header{align-items:start;gap:10px}}
</style><div id="login"><h1>Portal Content Hub</h1><p><span id="loginHelp">Memeriksa pengaturan login…</span></p><input id="token" type="password" autocomplete="off" placeholder="Token admin lama — hanya untuk pengaturan pertama" style="width:100%" hidden><input id="password" type="password" autocomplete="current-password" placeholder="Password administrator" style="width:100%;margin-top:12px"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi password baru (minimal 12 karakter)" style="width:100%;margin-top:12px" hidden><p><button onclick="signIn()">Masuk dashboard →</button></p><div id="msg"></div></div><div id="app" hidden><aside><h2><b>P</b> Portal Hub</h2><nav id="nav"></nav><small>CONTENT OPERATIONS<br>Asia/Makassar · WITA<br>Tanpa AI API rutin</small></aside><main><header><div><div class="muted">WORKSPACE / CONTENT HUB</div><h1 id="title"></h1><div class="muted">Pusat pengumpulan konten untuk portal Anda</div></div><div class="row"><span id="clock" class="muted"></span><button onclick="load()">↻ Perbarui</button><button onclick="logout()">Keluar</button></div></header><section id="content"></section><footer>Portal Content Hub · Data diambil melalui backend · Tidak ada data konten dummy</footer></main></div><script src="/ai-settings.js"></script><script>
let sessionKey='',token='',state={},tab='Ringkasan';const tabs=['Ringkasan','RSS Manager','Rekomendasi','Berita','X Trending','YouTube Music','Sync Logs','API Integration','Pengaturan AI','Pengaturan'];const $=id=>document.getElementById(id);const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;const date=s=>s?new Date(s).toLocaleString('id-ID',{timeZone:'Asia/Makassar'}):'Belum tersedia';async function api(url,body){const r=await fetch('/api/admin/'+url,{method:body?'POST':'GET',headers:{'X-Hub-Request':'1','X-Admin-Session':sessionKey,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('Respons bukan API JSON. Buka live preview Portal Content Hub pada port 3000, lalu muat ulang halaman.');const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');return d;}let setupRequired=false;
async function authCall(path,body){const r=await fetch('/api/auth/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Hub-Request':'1','X-Admin-Session':sessionKey},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login gagal');if(d.sessionToken)sessionKey=d.sessionToken;return d;}
async function initAuth(){try{const d=await authCall('status');setupRequired=!d.configured;$('token').hidden=!setupRequired;$('confirmPassword').hidden=!setupRequired;$('loginHelp').textContent=setupRequired?'Buat password administrator. Masukkan token admin lama satu kali untuk mengamankan pengaturan awal. Setelah ini cukup login dengan password.':'Masuk dengan password administrator. Sesi berlaku maksimal 12 jam.';if(d.authenticated){token='session';await load();$('login').hidden=true;$('app').hidden=false;}}catch(e){$('msg').textContent=e.message;}}
async function signIn(){try{const password=$('password').value;if(setupRequired&&password!==$('confirmPassword').value)throw Error('Konfirmasi password tidak sama');$('msg').textContent='Memeriksa…';await authCall(setupRequired?'setup':'login',setupRequired?{token:$('token').value.trim(),password}:{password});token='session';await load();$('login').hidden=true;$('app').hidden=false;$('token').value='';$('password').value='';$('confirmPassword').value='';$('msg').textContent='';}catch(e){$('msg').textContent=e.message;}}
async function logout(){await authCall('logout',{});sessionKey='';token='';aiState=null;$('content').innerHTML='';$('app').hidden=true;$('login').hidden=false;await initAuth();}
let pushPoll=null;
async function pushVercel(){if(!confirm('Kirim data ke Vercel sekarang? Ini dapat menambahkan artikel ke database bersama.'))return;try{await api('push',{});await load();clearInterval(pushPoll);pushPoll=setInterval(async()=>{try{const p=await api('push/status');state.push=p;if(tab==='API Integration')render();if(p.status!=='running'){clearInterval(pushPoll);pushPoll=null;}}catch{clearInterval(pushPoll);pushPoll=null;}},3000);}catch(e){alert(e.message);}}
async function load(){state=await api('state');state.recommended=await api('recommended');render();}function sync(type,id){api('sync',{type,sourceId:id}).then(()=>{alert('Sinkronisasi dimulai. Perbarui untuk melihat log.');load();}).catch(e=>alert(e.message));}function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||'<tr><td>Belum ada data tersimpan.</td></tr>'}</tbody></table>`;}function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');$('title').textContent=tab;$('clock').textContent=new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Makassar',day:'numeric',month:'short',year:'numeric'});let h='';if(tab==='Ringkasan'){h=`<div class="notice">Backend dan database SQLite terhubung. Prioritas editorial Bali–NTB–NTT. Pengayaan AI khusus berita NTB bersifat opsional; atur melalui menu Pengaturan AI. Scheduler: <b>${esc(state.scheduler)}</b>. Preview ini bukan jaminan layanan produksi 24/7.</div><section class="cards">${[['Berita · 24 jam',state.stats.news24h],['RSS aktif',state.sources.filter(s=>s.is_active).length],['Tren · 1 hour ago',state.trends.items.length],['Video ditemukan',state.youtube.length]].map(([a,b])=>`<div class="card"><label>${a}</label><strong>${b}</strong></div>`).join('')}</section><div class="panel"><div class="row"><h3>Kesehatan sumber</h3><button onclick="sync('rss')">Sinkronkan RSS</button></div><p>Status bersumber dari pengujian aktual, bukan sekadar respons HTTP.</p>${table(['Sumber','Status','Terakhir berhasil'],state.sources.filter(s=>s.status!=='UNTESTED').map(s=>`<tr><td>${esc(s.name)}</td><td>${badge(s.status)}</td><td>${date(s.last_success_at)}</td></tr>`))}</div>`;}if(tab==='RSS Manager'){h=`<div class="row"><button onclick="addSource()">+ Tambah sumber</button><button onclick="sync('rss')">Sinkronkan RSS aktif</button></div><p>${state.sources.length} sumber terdaftar. Zetizen dibaca melalui parser XML khusus; sumber stale tetap nonaktif.</p><div class="panel">${table(['Sumber','Wilayah','Status','Artikel','Aksi'],state.sources.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.last_error||date(s.last_article_published_at))}</small></td><td>${esc(s.region)}</td><td>${badge(s.status)}</td><td>${s.item_count}</td><td><button onclick="sync('rss','${s.id}')">Uji</button> <button onclick="editSource('${s.id}')">Edit</button> <button onclick="toggle('${s.id}')">${s.is_active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`))}</div>`;}if(tab==='Rekomendasi')h=`<div class="notice">Target 60% berita / 40% hiburan · bobot editorial 25–39: 50%, 15–24: 25%, 40+: 25%. Bukan demografi aktual pengunjung.</div><div class="panel"><h3>Hasil komposisi</h3><p>${state.recommended.policy.actual.news} berita + ${state.recommended.policy.actual.entertainment} hiburan. ${state.recommended.policy.ratioSatisfied?'Rasio sesuai.':'Stok segar belum cukup untuk memenuhi rasio.'}</p><p>Konten lebih dari 72 jam tidak masuk rekomendasi. Artikel historis tetap tersimpan.</p></div><div class="articles">${state.recommended.items.map(n=>`<article class="article">${badge(n.contentGroup)} ${badge(n.audience_segment||'lintas segmen')}<h3>${esc(n.title)}</h3><p>${esc(n.summary||n.description_excerpt||'Ringkasan belum tersedia')}</p><small>Skor aturan: ${Math.round(n.score)} · ${date(n.published_at||n.video_published_at)}</small></article>`).join('')}</div>`;if(tab==='Berita')h=`<p>Pratinjau 30 artikel · ringkasan tanpa LLM · waktu publikasi tidak diganti waktu pengambilan.</p><div class="articles">${state.news.map(n=>`<article class="article">${badge(n.freshness_status)} <small>${esc(n.source_name)} · ${date(n.published_at)}</small><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p><small>${esc(n.keywords.join(' · '))}</small><p>${badge(n.summary_method)} ${badge('gambar: '+n.image_status)}</p><button onclick="editSummary('${n.id}')">Ringkasan editorial</button> <button onclick="retryImage('${n.id}')">Uji gambar</button></article>`).join('')||'<div class="panel">Belum ada berita. Jalankan sinkronisasi sumber.</div>'}</div>`;if(tab==='X Trending')h=`<div class="row"><button onclick="sync('x')">Run X Sync Now</button>${badge(state.trends.latestAttempt?.status||'UNTESTED')}</div><p>Trends24 Indonesia · hanya snapshot 1 hour ago. Snapshot sekitar satu jam sebelum pembaruan terbaru sumber, bukan waktu tren mulai viral.</p><p>Waktu snapshot sumber: ${date(state.trends.sourceSnapshotAt)} · ${esc(state.trends.freshnessStatus)}</p><div class="notice">${esc(state.trends.latestAttempt?.error_message||'Hanya daftar 1 hour ago dari Trends24. Bagian waktu lain tidak digabungkan.')}</div><div class="panel">${table(['Ranking','Tren','Diambil aplikasi'],state.trends.items.map(t=>`<tr><td>${t.rank??'—'}</td><td>${esc(t.trendText)}</td><td>${date(t.lastObservedAt)}</td></tr>`))}</div>`;if(tab==='YouTube Music')h=`<button onclick="sync('youtube')">Run YouTube Sync Now</button><div class="notice">${badge(state.logs.find(l=>l.sync_type==='youtube')?.status||'UNTESTED')} ${esc(state.logs.find(l=>l.sync_type==='youtube')?.error_message||'Metadata playlist disimpan dari sumber publik.')}</div><p>Playlist: OLT0p76Cd7kYMmbBNlt_TvC4vzjFTMKMNjw. Klasifikasi kata kunci bukan kepastian musik.</p><div class="panel">${table(['Judul','Channel','Publikasi','Pertama ditemukan'],state.youtube.map(t=>`<tr><td>${t.thumbnail_url?`<img src="${esc(t.thumbnail_url)}" width="100" loading="lazy" referrerpolicy="no-referrer" alt="Thumbnail video"><br>`:''}${esc(t.title)} ${badge(t.source_status)}</td><td>${esc(t.channel_title)}</td><td>${date(t.video_published_at)}</td><td>${date(t.first_seen_at)}</td></tr>`))}</div>`;if(tab==='Sync Logs')h=`<div class="panel">${table(['Jenis / sumber','Status','Ditemukan','Baru','Error','Mulai · WITA','Durasi'],state.logs.map(l=>`<tr><td>${esc(l.sync_type)}<br><small>${esc(l.error_message)}</small></td><td>${badge(l.status)}</td><td>${l.items_found}</td><td>${l.items_inserted}</td><td>${l.error_count}</td><td>${date(l.started_at)}</td><td>${l.duration_ms} ms</td></tr>`))}</div>`;if(tab==='API Integration')h=`<div class="panel"><h3>Push ke Vercel</h3><p>Kirim hasil tersimpan dari Hub ke Supabase melalui Vercel. Tidak mengumpulkan RSS baru dan tidak melakukan deploy kode.</p><p><b>Penting:</b> Preview memakai database bersama; artikel baru dapat tampil di situs utama.</p><button onclick="pushVercel()" ${state.push?.status==='running'||!state.push?.configured?'disabled':''}>${state.push?.status==='running'?'Sedang mengirim…':'Push ke Vercel'}</button> <button onclick="load()">Perbarui status</button><p>Status: <b>${esc(state.push?.status||'idle')}</b> · Mulai: ${date(state.push?.startedAt)} · Selesai: ${date(state.push?.finishedAt)}</p>${!state.push?.configured?'<p>Konfigurasi backend push belum lengkap.</p>':''}${state.push?.result?`<p>Kandidat: ${state.push.result.found} · Artikel baru: ${state.push.result.inserted} · Duplikat: ${state.push.result.skipped} · Error impor: ${state.push.result.errorCount}</p><p>Snapshot: ${esc(state.push.result.snapshots.join(', '))}</p>`:''}${state.push?.error?`<p>${esc(state.push.error)}</p>`:''}<p>AI SEO NTB (${esc(state.ntbAi?.provider||'mistral')}): ${state.ntbAi?.enabled?'aktif sesuai syarat dan batas batch':'nonaktif'} · API key: ${state.ntbAi?.keyConfigured?'terpasang':'belum terpasang'}. Hasil push berhasil tidak selalu berarti ada artikel yang diproses AI.</p></div><div class="panel"><h3>API read-only · server-to-server</h3><p>Base URL preview: <b>${esc(location.origin)}</b><br>Token portal berbeda dari token admin. Nilainya tidak ditampilkan di dashboard.</p><pre>GET /api/portal-feed?type=recommended&amp;limit=20\nGET /api/portal-feed?type=news&amp;limit=50\nGET /api/portal-feed?type=x-trends\nGET /api/portal-feed?type=youtube-music\nGET /api/portal-feed?type=all\nGET /api/health\nAuthorization: Bearer [PORTAL_API_TOKEN]</pre><p>Simpan PORTAL_HUB_URL dan PORTAL_API_TOKEN di environment backend Vercel, bukan NEXT_PUBLIC_*.</p><pre>const response = await fetch(process.env.PORTAL_HUB_URL + '/api/portal-feed?type=recommended', {\n  headers: { Authorization: 'Bearer ' + process.env.PORTAL_API_TOKEN },\n  next: { revalidate: 300 }\n});</pre><p>URL preview sementara bukan URL deployment produksi. API tidak melakukan scraping ketika dibuka.</p></div>`;if(tab==='Pengaturan')h=`<div class="panel"><h3>Interval & retensi</h3><p>Scheduler ${esc(state.scheduler)}. Hanya berjalan selama proses preview hidup; bukan cron produksi.</p><p>${(state.automation||[]).map(a=>esc(a.type)+': '+date(a.nextAt)).join('<br>')}</p>${['rss_sync_interval_hours','x_sync_interval_hours','youtube_sync_interval_hours','x_refresh_cooldown_minutes','news_retention_days','trends_retention_days','youtube_retention_days'].map(k=>`<p><label>${esc(k)} <input type="number" min="1" id="${k}" value="${esc(state.settings[k])}"></label></p>`).join('')}<button onclick="saveSettings()">Simpan pengaturan</button></div>`;if(tab==='Pengaturan AI')h=renderAi();$('content').innerHTML=h;}async function toggle(id){const s=state.sources.find(s=>s.id===id);try{await api('source',{...s,is_active:!s.is_active});load();}catch(e){alert(e.message);}}async function addSource(){const name=prompt('Nama sumber'),feed_url=prompt('URL RSS publik');if(!name||!feed_url)return;try{await api('source',{name,feed_url,is_active:true});load();}catch(e){alert(e.message);}}async function editSummary(id){const summary=prompt('Ringkasan editorial manual (maks. 1.000 karakter)');if(summary!==null){await api('editorial',{id,summary});load();}}async function saveSettings(){const o={};for(const el of $('content').querySelectorAll('input'))o[el.id]=el.value;try{await api('settings',o);load();}catch(e){alert(e.message);}}
async function retryImage(id){try{const r=await api('image',{id});alert('Gambar: '+r.imageStatus);load();}catch(e){alert(e.message);}}
async function editSource(id){const s=state.sources.find(s=>s.id===id);const name=prompt('Nama sumber',s.name);if(!name)return;const feed_url=prompt('URL sumber',s.feed_url);if(!feed_url)return;try{await api('source',{...s,name,feed_url});load();}catch(e){alert(e.message);}}
setInterval(()=>{if(token&&!$('app').hidden&&tab!=='Pengaturan AI')load().catch(e=>console.warn(e.message));},30000);
for(const id of ['token','password','confirmPassword'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});initAuth();
</script></html>
